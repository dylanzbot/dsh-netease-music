# 发 npm 流水线：由 release-please 打出的 tag 触发（tag 驱动，非 push main 驱动）
# 发布认证走 npm Trusted Publishing（OIDC），不再使用长期 NPM_TOKEN

name: Publish to npm

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      ref:
        description: '要发布的 tag 或分支（例如 v0.1.0）；留空则用当前分支'
        required: false
        type: string

permissions:
  contents: read
  id-token: write # npm Trusted Publishing 需要 OIDC token

concurrency:
  group: npm-publish-ncm
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24 # Node 24 自带 npm 11.5.2+，满足 Trusted Publishing 要求
          cache: npm

      # 发布前查一次 registry：已发布则跳过（幂等重跑），只有 E404 才继续发布。
      # 网络错误 / 权限错误一律 fail closed，避免把真失败误判成"还没同步"。
      - name: Check publication state
        id: check
        env:
          REGISTRY: https://registry.npmjs.org
        run: |
          set -euo pipefail
          PKG="$(node -p "require('./package.json').name")"
          VERSION="$(node -p "require('./package.json').version")"
          echo "包名：${PKG}   版本：${VERSION}"

          if output="$(npm view "${PKG}@${VERSION}" version --registry="${REGISTRY}" 2>&1)"; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
            echo "✅ ${PKG}@${VERSION} 已在 registry，跳过本次发布"
          elif grep -Eq '^npm (ERR!|error) code E404$' <<< "$output"; then
            echo "already_published=false" >> "$GITHUB_OUTPUT"
            echo "registry 上查不到 ${PKG}@${VERSION}，继续发布"
          else
            echo "::error::npm view 失败（非 E404），中止发布："
            echo "$output" >&2
            exit 1
          fi

      - name: Install deps
        if: steps.check.outputs.already_published != 'true'
        run: npm ci

      - name: Typecheck
        if: steps.check.outputs.already_published != 'true'
        run: npm run typecheck

      - name: Test
        if: steps.check.outputs.already_published != 'true'
        run: npm test

      - name: Build
        if: steps.check.outputs.already_published != 'true'
        run: npm run build

      - name: Publish to npm
        if: steps.check.outputs.already_published != 'true'
        # OIDC trusted publishing：id-token: write 提供身份令牌，npm 用它换取发布权限。
        # --provenance 把同一令牌写进 tarball 的来源证明。
        run: npm publish --provenance --access public --registry=https://registry.npmjs.org
